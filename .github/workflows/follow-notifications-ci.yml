name: Follow and Notifications Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - "src/modules/follows/**"
      - "src/modules/notifications/**"
      - "src/pages/Followers.tsx"
      - "src/pages/Notifications.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/follow-notifications-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/modules/follows/**"
      - "src/modules/notifications/**"
      - "src/pages/Followers.tsx"
      - "src/pages/Notifications.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/follow-notifications-ci.yml"
  workflow_dispatch:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint follow and notifications frontend
        run: npm exec eslint -- src/modules/follows src/modules/notifications src/pages/Followers.tsx src/pages/Notifications.tsx

      - name: Build frontend
        run: npm run build
